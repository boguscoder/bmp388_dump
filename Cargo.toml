[package]
name = "bmp388_dump"
version = "0.2.0"
edition = "2024"

[dependencies]
cortex-m-rt = "0.7.0"

log = "0.4.27"

embassy-executor = { version = "0.10.0", features = [
  "executor-thread",
  "executor-interrupt",
  "platform-cortex-m",
] }
embassy-rp = { version = "0.10.0", features = [
  "critical-section-impl",
  "time-driver",
  "rp235xa",
] }
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embassy-usb-logger = "0.6.0"
embassy-futures = "0.1.2"
static_cell = "2.0"

bmp388-embedded = { version = "0.1", features = ["async"] }

panic-probe = "1.0.0"
